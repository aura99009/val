<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will you be my Valentine? 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #1a0a0a 0%, #2d1515 25%, #1a0a0a 50%, #3d1a1a 100%);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      overflow: hidden;
      position: relative;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* Floating hearts background */
    .hearts-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 1.5rem;
      opacity: 0.15;
      animation: float 6s ease-in-out infinite;
    }

    .heart:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
    .heart:nth-child(2) { left: 85%; top: 15%; animation-delay: 1s; }
    .heart:nth-child(3) { left: 25%; top: 80%; animation-delay: 2s; }
    .heart:nth-child(4) { left: 70%; top: 70%; animation-delay: 0.5s; }
    .heart:nth-child(5) { left: 50%; top: 10%; animation-delay: 1.5s; }
    .heart:nth-child(6) { left: 15%; top: 50%; animation-delay: 2.5s; }
    .heart:nth-child(7) { left: 90%; top: 45%; animation-delay: 0.8s; }
    .heart:nth-child(8) { left: 40%; top: 90%; animation-delay: 1.8s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.15; }
      50% { transform: translateY(-20px) scale(1.1); opacity: 0.25; }
    }

    .card {
      background: linear-gradient(160deg, rgba(255, 182, 193, 0.12) 0%, rgba(255, 105, 135, 0.08) 50%, rgba(139, 0, 0, 0.15) 100%);
      border: 2px solid rgba(255, 182, 193, 0.4);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 420px;
      position: relative;
      z-index: 1;
      box-shadow: 
        0 0 40px rgba(255, 105, 135, 0.2),
        inset 0 0 60px rgba(255, 182, 193, 0.05);
      backdrop-filter: blur(10px);
    }

    .card::before {
      content: '💕';
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2rem;
      filter: drop-shadow(0 2px 8px rgba(255, 105, 135, 0.4));
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: #ffb6c1;
      text-shadow: 0 0 20px rgba(255, 182, 193, 0.5);
      margin-bottom: 2rem;
      line-height: 1.4;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 1.5rem;
      position: relative;
      min-height: 56px;
    }

    .btn {
      padding: 0.9rem 2rem;
      font-size: 1.1rem;
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
      color: white;
      box-shadow: 0 4px 20px rgba(255, 107, 157, 0.5);
    }

    .btn-yes:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 28px rgba(255, 107, 157, 0.6);
    }

    .btn-yes:active {
      transform: scale(0.98);
    }

    .btn-no {
      background: linear-gradient(135deg, #4a4a4a 0%, #2d2d2d 100%);
      color: #ffb6c1;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .btn-no.running {
      position: fixed;
      transition: left 0.15s ease-out, top 0.15s ease-out;
    }

    .btn-no:hover {
      transform: scale(1.02);
    }

    /* Popup overlay */
    .popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      animation: fadeIn 0.4s ease;
    }

    .popup-overlay.show {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .popup {
      background: linear-gradient(165deg, #2d1515 0%, #1a0a0a 40%, #3d1a1a 100%);
      border: 2px solid rgba(255, 182, 193, 0.5);
      border-radius: 24px;
      padding: 2.5rem;
      max-width: 380px;
      text-align: center;
      position: relative;
      box-shadow: 
        0 0 60px rgba(255, 105, 135, 0.3),
        inset 0 0 40px rgba(255, 182, 193, 0.05);
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.8) translateY(-20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .popup .confetti {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.2rem;
      letter-spacing: 4px;
    }

    .popup h2 {
      font-family: 'Playfair Display', serif;
      color: #ffb6c1;
      font-size: 1.5rem;
      margin: 1rem 0 0.8rem;
      line-height: 1.5;
      text-shadow: 0 0 20px rgba(255, 182, 193, 0.4);
    }

    .popup .name {
      color: #ff6b9d;
      font-weight: 700;
      font-size: 1.4rem;
      display: block;
      margin: 0.5rem 0;
      text-shadow: 0 0 15px rgba(255, 107, 157, 0.6);
    }

    .popup p {
      color: rgba(255, 182, 193, 0.95);
      font-size: 1rem;
      line-height: 1.6;
      margin-top: 0.5rem;
    }

    .popup .hearts-end {
      font-size: 1.8rem;
      margin-top: 1rem;
      letter-spacing: 6px;
    }
  </style>
</head>
<body>
  <div class="hearts-bg">
    <span class="heart">❤️</span>
    <span class="heart">💕</span>
    <span class="heart">💗</span>
    <span class="heart">❤️</span>
    <span class="heart">💕</span>
    <span class="heart">💗</span>
    <span class="heart">❤️</span>
    <span class="heart">💕</span>
  </div>

  <div class="card">
    <h1>Do you wanna be my Valentine? 💝</h1>
    <div class="buttons">
      <button class="btn btn-yes" id="btnYes">Yes</button>
      <button class="btn btn-no" id="btnNo">No</button>
    </div>
  </div>

  <div class="popup-overlay" id="popup">
    <div class="popup">
      <div class="confetti">💖🎉🎊🎊</div>
      <h2>Congratulations</h2>
      <span class="name">MY girl "Deepika lmc"</span>
      <p>You are no 1 in Quadrillion to be MY WIFE.</p>
      <div class="hearts-end">💕 💖 💕</div>
    </div>
  </div>

  <script>
    const btnNo = document.getElementById('btnNo');
    const btnYes = document.getElementById('btnYes');
    const popup = document.getElementById('popup');
    const MAX_NO_MOVES = 5;
    let noMoveCount = 0;

    function moveNoButton() {
      if (noMoveCount >= MAX_NO_MOVES) {
        btnNo.style.display = 'none';
        return;
      }
      noMoveCount++;
      btnNo.classList.add('running');
      const btnRect = btnNo.getBoundingClientRect();
      const maxX = window.innerWidth - btnRect.width - 24;
      const maxY = window.innerHeight - btnRect.height - 24;
      const randomX = Math.max(12, Math.random() * maxX);
      const randomY = Math.max(12, Math.random() * maxY);
      btnNo.style.left = randomX + 'px';
      btnNo.style.top = randomY + 'px';
      if (noMoveCount >= MAX_NO_MOVES) {
        btnNo.style.display = 'none';
      }
    }

    btnNo.addEventListener('mousedown', (e) => {
      e.preventDefault();
      moveNoButton();
    });
    btnNo.addEventListener('click', (e) => {
      e.preventDefault();
      moveNoButton();
    });
    btnNo.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNoButton();
    });

    btnYes.addEventListener('click', () => {
      popup.classList.add('show');
    });

    popup.addEventListener('click', (e) => {
      if (e.target === popup) {
        popup.classList.remove('show');
      }
    });
  </script>
</body>
</html>
